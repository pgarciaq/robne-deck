name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, not `ubuntu-latest`: the handout step needs a Chrome binary
    # (Marp renders PDF and PPTX through a headless browser) and this image
    # ships Google Chrome. `ubuntu-latest` moves to 26.04 in November 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the customer deck
        run: npm run build:customer

      - name: Build the engineering deck
        run: npm run build:eng

      - name: Build PDF and PPTX handouts
        run: npm run build:handouts

      - name: Prepare Pages artifact
        run: npm run assemble:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
